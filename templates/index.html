<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Smart Remote</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f5f7fa;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }

    .container {
      background: white;
      padding: 30px;
      margin-top: 40px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 400px;
    }

    h2 {
      text-align: center;
      margin-bottom: 24px;
      color: #333;
    }

    h3 {
      margin-top: 20px;
      color: #444;
    }

    label {
      font-weight: 600;
      margin-top: 10px;
    }

    input, select, button {
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      border-radius: 6px;
      border: 1px solid #ccc;
      box-sizing: border-box;
      font-size: 14px;
    }

    button {
      background-color: #4a90e2;
      color: white;
      font-weight: bold;
      cursor: pointer;
      border: none;
      transition: background-color 0.2s ease;
    }

    button:hover {
      background-color: #357ab8;
    }

    .danger {
      background-color: #e94e4e;
    }

    .danger:hover {
      background-color: #c63d3d;
    }

    #status {
      margin-top: 20px;
      text-align: center;
      color: green;
    }

    /* Dark mode styles */
    body.dark-mode {
      background-color: #181a1b;
    }
    .dark-mode .container {
      background: #23272b;
      color: #f1f1f1;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
    }
    .dark-mode h2, .dark-mode h3, .dark-mode label {
      color: #f1f1f1;
    }
    .dark-mode input, .dark-mode select, .dark-mode button {
      background-color: #2c2f34;
      color: #f1f1f1;
      border: 1px solid #444;
    }
    .dark-mode button {
      background-color: #357ab8;
      color: #fff;
    }
    .dark-mode button:hover {
      background-color: #285a8c;
    }
    .dark-mode .danger {
      background-color: #b23b3b;
    }
    .dark-mode .danger:hover {
      background-color: #8a2929;
    }
    .dark-mode #status {
      color: #7fff7f;
    }
  </style>
</head>
<body>
  <div class="container">
    <button id="darkModeToggle" style="float:right;margin-bottom:10px;">🌙 Dark Mode</button>
    <h2>Smart Remote Control</h2>

    <div>
      <h3>AC & Fan Settings</h3>
      <label for="acSetting">AC Setting:</label>
      <select id="acSetting">
        <option value="25">25°C</option>
      </select>
      <label for="acTime">AC Time (minutes):</label>
      <input type="number" id="acTime" value="15" min="1">
      <label for="fanSpeed">Fan Speed:</label>
      <select id="fanSpeed">
        <option value="0">Off</option>
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
      </select>
      <button onclick="sendFrontEndTarget()">Send</button>
    </div>

    <div style="margin-top:15px;">
      <button class="danger" style="width:100%;font-size:16px;background-color:#e98c1e;border:none;" onclick="samMode()">🐶 Sam's Mode</button>
    </div>

    <div style="margin-top:30px;">
      <button class="danger" style="width:100%;font-size:16px;" onclick="stopAll()">🛑 Stop All</button>
    </div>

    <div id="status"></div>
  </div>

  <script>
    async function postCommand(endpoint, data = {}) {
      try {
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        const result = await res.json();
        document.getElementById('status').innerText = result.status || 'Success';
      } catch (err) {
        document.getElementById('status').innerText = 'Error: ' + err;
      }
    }

    function sendFrontEndTarget() {
      const acSetting = document.getElementById('acSetting').value;
      const acTime = document.getElementById('acTime').value;
      const fanSpeed = document.getElementById('fanSpeed').value;
      postCommand('/front_end_target', {
        ac_setting: acSetting,
        ac_time: acTime,
        fan_speed_requested: fanSpeed
      });
    }

    function stopAll() {
      fetch('/stop_all')
        .then(res => res.json())
        .then(data => {
          document.getElementById('status').innerText = data.status || 'Stopped';
        })
        .catch(err => {
          document.getElementById('status').innerText = 'Error: ' + err;
        });
    }

    function samMode() {
      fetch('/sam_mode')
        .then(res => res.json())
        .then(data => {
          document.getElementById('status').innerText = data.status || 'Sam mode started';
        })
        .catch(err => {
          document.getElementById('status').innerText = 'Error: ' + err;
        });
    }

    // Dark mode toggle
    const darkModeBtn = document.getElementById('darkModeToggle');
    function setDarkMode(on) {
      document.body.classList.toggle('dark-mode', on);
      localStorage.setItem('darkMode', on ? '1' : '0');
      darkModeBtn.innerText = on ? '☀️ Light Mode' : '🌙 Dark Mode';
    }
    darkModeBtn.addEventListener('click', () => {
      setDarkMode(!document.body.classList.contains('dark-mode'));
    });
    // On load, set mode from localStorage
    if (localStorage.getItem('darkMode') === '1') setDarkMode(true);
  </script>

</body>
</html>
