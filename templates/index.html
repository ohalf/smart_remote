<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Smart Remote</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f5f7fa;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }

    .container {
      background: white;
      padding: 30px;
      margin-top: 40px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 400px;
    }

    h2 {
      text-align: center;
      margin-bottom: 24px;
      color: #333;
    }

    h3 {
      margin-top: 20px;
      color: #444;
    }

    label {
      font-weight: 600;
      margin-top: 10px;
    }

    input, select, button {
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      border-radius: 6px;
      border: 1px solid #ccc;
      box-sizing: border-box;
      font-size: 14px;
    }

    button {
      background-color: #4a90e2;
      color: white;
      font-weight: bold;
      cursor: pointer;
      border: none;
      transition: background-color 0.2s ease;
    }

    button:hover {
      background-color: #357ab8;
    }

    .danger {
      background-color: #e94e4e;
    }

    .danger:hover {
      background-color: #c63d3d;
    }

    #status {
      margin-top: 20px;
      text-align: center;
      color: green;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Smart Remote Control</h2>

    <div>
      <h3>AC Sequence</h3>
      <label for="acDuration">Duration (seconds):</label>
      <input type="number" id="acDuration" value="60">
      <button onclick="runAC()">Run AC Sequence</button>
    </div>

    <div>
      <h3>Fan Control</h3>
      <label for="fanPower">Fan Power:</label>
      <select id="fanPower">
        <option value="1">1 (Low)</option>
        <option value="2">2 (Medium)</option>
        <option value="3">3 (High)</option>
      </select>
      <button onclick="runFan()">Turn On Fan</button>
    </div>

    <div>
      <h3>Emergency Stop</h3>
      <button class="danger" onclick="stopAll()">Stop All</button>
    </div>

    <div id="status"></div>
  </div>

  <script>
    async function postCommand(endpoint, data = {}) {
      try {
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        const result = await res.json();
        document.getElementById('status').innerText = result.status || 'Success';
      } catch (err) {
        document.getElementById('status').innerText = 'Error: ' + err;
      }
    }

    function runAC() {
      const minutes = parseInt(document.getElementById('acDuration').value);
      postCommand('/post_ac_then_off', { time_in_minutes: minutes });
    }

    function runFan() {
      const minutes = parseInt(document.getElementById('acDuration').value);
      postCommand('/post_ac_then_fan', { time_in_minutes_between: minutes });
    }

    function stopAll() {
      // Your backend expects GET for /stop_all
      fetch('/stop_all')
        .then(res => res.json())
        .then(data => {
          document.getElementById('status').innerText = data.status || 'Stopped';
        })
        .catch(err => {
          document.getElementById('status').innerText = 'Error: ' + err;
        });
    }
  </script>

</body>
</html>
